<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read-along</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Meta Ray-Ban Display: 600x600 additive display. Black is see-through,
   so everything is bright-on-black. Input arrives as arrow keys + Enter. */
:root {
  --bg: #000;
  --text: #ffffff;
  --spoken: #ffc861;
  --dim: #8c8c8c;
  --faint: #5a5a5a;
  --focus: #ffc861;
  --ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; }
#app {
  width: 100vw; height: 100vh;
  max-width: 600px; max-height: 600px;
  margin: 0 auto;
  position: relative;
  padding: 34px 40px;
  display: flex; flex-direction: column;
}
.screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
.screen.on { display: flex; }

/* library */
h1 { font-size: 26px; font-weight: 700; margin: 0 0 22px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.list li {
  border: 2px solid transparent;
  border-radius: 18px;
  padding: 14px 18px;
}
.list li .t { font-size: 26px; font-weight: 700; line-height: 1.2; }
.list li .a { font-size: 19px; color: var(--dim); margin-top: 4px; }
.list li.sel { border-color: var(--focus); }
.list li.sel .t { color: var(--spoken); }
.list li .a .tag { color: var(--faint); }
.msg { font-size: 22px; line-height: 1.4; color: var(--dim); }
/* Google Drive sign-in */
#connect .big { font-size: 34px; font-weight: 700; color: var(--text); margin: 6px 0 22px; }
#connect .code { font-size: 54px; font-weight: 700; letter-spacing: 4px; color: var(--spoken); margin: 6px 0 22px; }
.hint { margin-top: auto; font-size: 18px; color: var(--faint); }

/* reader */
.top { display: flex; align-items: center; gap: 12px; font-size: 17px; color: var(--dim); }
.top .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; background: #262626; border-radius: 2px; margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--dim); }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 0; }
.prev, .next { font-size: 22px; line-height: 1.35; color: var(--faint); }
.prev { color: var(--dim); }
.cur { font-size: 38px; line-height: 1.3; font-weight: 700; }
.cur .w.lit { color: var(--spoken); }
.state { display: flex; justify-content: space-between; font-size: 18px; color: var(--dim); font-variant-numeric: tabular-nums; }
.paused-badge { color: var(--spoken); font-weight: 700; }

/* menu overlay */
#menu {
  position: absolute; inset: 0;
  background: #000;
  display: none; flex-direction: column; justify-content: center;
  padding: 40px;
}
#menu.on { display: flex; }
#menu h2 { font-size: 22px; color: var(--dim); margin: 0 0 16px; font-weight: 400; }
#menu .row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 28px; padding: 14px 18px; border-radius: 16px; border: 2px solid transparent;
}
#menu .row.sel { border-color: var(--focus); }
#menu .row .v { color: var(--spoken); font-variant-numeric: tabular-nums; }
#menu .row .v::before { content: "‹ "; color: var(--faint); }
#menu .row .v::after { content: " ›"; color: var(--faint); }
#menu .row.action .v::before, #menu .row.action .v::after { content: ""; }
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="library" aria-label="Library">
    <h1>Read-along</h1>
    <ul class="list" id="books"></ul>
    <p class="msg" id="libMsg">Loading books…</p>
    <p class="hint" id="libHint" hidden>Up and down to choose. Select to open.</p>
  </section>

  <section class="screen" id="connect" aria-label="Connect Google Drive">
    <h1>Connect Google Drive</h1>
    <div id="connectBody"><p class="msg">Getting a code…</p></div>
    <p class="hint">Back to cancel.</p>
  </section>

  <section class="screen" id="reader" aria-label="Reader">
    <div class="top"><span class="title" id="rTitle"></span><span id="rPct"></span></div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="stage" aria-live="off">
      <div class="prev" id="rPrev"></div>
      <div class="cur" id="rCur"></div>
      <div class="next" id="rNext"></div>
    </div>
    <div class="state"><span id="rState"></span><span id="rTime"></span></div>
  </section>

  <div id="menu" role="dialog" aria-label="Options">
    <h2>Options</h2>
    <div id="menuRows"></div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="cloud-config.js"></script>
<script src="cloud.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const audio = $("audio");
  const MAX_WORDS = 7;
  const SPEEDS = [0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];

  const st = {
    screen: "library", books: [], sel: 0,
    book: null, chunks: [], starts: [], idx: -1,
    offset: 0, speedIdx: 2, menuOpen: false, menuSel: 0, loading: false,
  };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function clock(t) {
    t = Math.max(0, Math.floor(t || 0));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }

  // ---------- library ----------
  async function fetchJSON(url) {
    const r = await fetch(url, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  const Cloud = window.ReadalongCloud || { enabled: false, signedIn: () => false };
  const CONNECT = { connect: true, title: "Connect Google Drive", author: "Play your own books from your Drive" };

  async function loadLibrary() {
    const books = [];
    for (const [url, priv] of [["library.json", false], ["library.private.json", true]]) {
      try { const d = await fetchJSON(url); (d.books || []).forEach((b) => books.push({ ...b, private: priv })); } catch {}
    }
    if (Cloud.enabled && Cloud.signedIn()) {
      try {
        const listed = await Cloud.listBooks();
        for (const b of listed) { b.offline = await Cloud.isDownloaded(b); books.push(b); }
        // Books removed on another device: free the space their downloads use here.
        const still = new Set(listed.map((b) => b.id));
        for (const old of store.get("readalong:drive-books") || []) {
          if (!still.has(old.id)) await Cloud.removeDownload(old);
        }
      } catch (e) {
        // Offline: still list Drive books seen before that are downloaded on this device.
        for (const b of store.get("readalong:drive-books") || []) {
          if (await Cloud.isDownloaded(b)) { b.offline = true; books.push(b); }
        }
      }
      store.set("readalong:drive-books", books.filter((b) => b.drive));
    }
    if (Cloud.enabled && !Cloud.signedIn()) books.push(CONNECT);
    st.books = books;
    st.sel = Math.min(st.sel, Math.max(0, books.length - 1));
    const want = new URLSearchParams(location.search).get("book");
    if (want) {
      const i = books.findIndex((b) => b.id === want);
      if (i >= 0) { st.sel = i; return openBook(books[i]); }
    }
    renderLibrary();
  }
  function renderLibrary() {
    $("books").innerHTML = st.books.map((b, i) => {
      const tag = b.drive ? `<span class="tag">${b.author ? " · " : ""}Drive${b.offline ? ", downloaded" : ""}</span>` : "";
      const sub = b.author || tag ? `<div class="a">${esc(b.author || "")}${tag}</div>` : "";
      return `<li class="${i === st.sel ? "sel" : ""}"><div class="t">${esc(b.title)}</div>${sub}</li>`;
    }).join("");
    const sel = $("books").children[st.sel];
    if (sel) sel.scrollIntoView({ block: "nearest" });
    if (!st.loading) {
      $("libMsg").textContent = st.books.length ? "" : "No books yet. Run tools/fetch_example.py, then reload.";
      $("libMsg").hidden = !!st.books.length;
    }
    $("libHint").hidden = !st.books.length;
  }
  function show(screen) {
    st.screen = screen;
    for (const s of ["library", "connect", "reader"]) $(s).classList.toggle("on", screen === s);
  }

  // ---------- Google Drive sign-in: a code to enter on the phone ----------
  let signIn = null;
  async function connectDrive() {
    show("connect");
    $("connectBody").innerHTML = `<p class="msg">Getting a code…</p>`;
    try {
      signIn = await Cloud.startSignIn();
      if (st.screen !== "connect") { signIn.cancel(); signIn = null; return; }
      $("connectBody").innerHTML =
        `<p class="msg">On your phone, go to</p><div class="big">${esc(signIn.url.replace(/^https?:\/\/(www\.)?/, ""))}</div>` +
        `<p class="msg">and enter</p><div class="code">${esc(signIn.code)}</div>`;
      const ok = await signIn.done;
      signIn = null;
      if (ok) {
        $("connectBody").innerHTML = `<p class="msg">Connected.</p>`;
        st.sel = 0;
        await loadLibrary();
        show("library");
      }
    } catch (e) {
      signIn = null;
      if (st.screen === "connect") $("connectBody").innerHTML = `<p class="msg">${esc(e.message)}</p>`;
    }
  }
  function cancelConnect() {
    if (signIn) { signIn.cancel(); signIn = null; }
    show("library");
    renderLibrary();
  }

  // ---------- chunking lines for the small display ----------
  function chunkLines(lines) {
    const out = [];
    for (const l of lines) {
      const words = l.words && l.words.length ? l.words : null;
      if (!words) { out.push({ start: l.start, words: null, text: l.text }); continue; }
      let i = 0;
      while (i < words.length) {
        let n = Math.min(MAX_WORDS, words.length - i);
        // prefer to break after punctuation, and avoid leaving 1-2 word scraps
        if (i + n < words.length) {
          for (let k = n; k >= Math.ceil(MAX_WORDS / 2); k--) {
            if (/[,;:.!?—–…]["”’)\]]*$/.test(words[i + k - 1].w)) { n = k; break; }
          }
          const rest = words.length - i;
          if (rest - n < 3 && rest <= MAX_WORDS * 2) n = Math.ceil(rest / 2);
        }
        const part = words.slice(i, i + n);
        const first = part.find((w) => w.s != null);
        out.push({ start: first ? first.s : l.start, words: part, text: part.map((w) => w.w).join(" ") });
        i += n;
      }
    }
    for (let k = 1; k < out.length; k++) if (out[k].start < out[k - 1].start) out[k].start = out[k - 1].start;
    return out;
  }

  // ---------- opening a book ----------
  let download = null;   // AbortController while a Drive book downloads
  async function openBook(b) {
    if (b.connect) return connectDrive();
    if (st.loading) return;
    st.loading = true;
    $("libMsg").hidden = false;
    $("libMsg").textContent = "Opening " + b.title + "…";
    try {
      let data, src;
      if (b.drive) {
        download = new AbortController();
        const got = await Cloud.getBook(b, {
          signal: download.signal,
          onProgress: (p) => { $("libMsg").textContent = `Downloading ${b.title}… ${Math.round(p * 100)}%  (Back to cancel)`; },
        });
        b.offline = true;
        data = JSON.parse(got.sync);
        if (audio.src.startsWith("blob:")) URL.revokeObjectURL(audio.src);
        src = URL.createObjectURL(got.audio);
      } else {
        data = await fetchJSON(b.sync);
        src = b.audio;
      }
      st.book = b;
      st.chunks = chunkLines((data.lines || []).filter((l) => typeof l.start === "number"));
      st.starts = st.chunks.map((c) => c.start);
      st.idx = -1;
      st.touched = false;   // set once you play or move; until then, never save (it would overwrite your place with 0)
      // This device's place, unless another device (via Google Drive) saved a newer one.
      let saved = store.get("readalong:" + b.id) || {};
      const remote = Cloud.enabled && Cloud.signedIn() ? await Cloud.getPosition(b.id) : null;
      if (remote && (remote.at || 0) > (saved.at || 0)) saved = remote;
      audio.src = src;
      st.offset = saved.offset || 0;
      st.speedIdx = SPEEDS.indexOf(saved.speed) >= 0 ? SPEEDS.indexOf(saved.speed) : 2;
      audio.playbackRate = SPEEDS[st.speedIdx];
      if (saved.pos) {
        if (audio.readyState >= 1) audio.currentTime = saved.pos;
        else audio.addEventListener("loadedmetadata", () => { audio.currentTime = saved.pos; }, { once: true });
      }
      $("rTitle").textContent = b.title;
      $("libMsg").textContent = "";
      show("reader");
      update();
    } catch (e) {
      $("libMsg").textContent = e.name === "AbortError" ? "Download cancelled."
        : e.signedOut ? "Connect Google Drive again to open this book."
        : b.drive ? "Couldn’t download that book: " + e.message
        : "Couldn’t open that book. Check that its files are in web/books.";
      if (e.signedOut) loadLibrary();
    } finally {
      st.loading = false;
      download = null;
    }
  }

  // ---------- reading view ----------
  function chunkAt(t) {
    const s = st.starts; let lo = 0, hi = s.length - 1, ans = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (s[m] <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }
  function wordsHTML(c) {
    return c.words ? c.words.map((w, j) => `<span class="w" data-j="${j}">${esc(w.w)}</span>`).join(" ") : esc(c.text);
  }
  function update() {
    if (!st.chunks.length) return;
    const t = audio.currentTime + st.offset;
    const i = chunkAt(t);
    if (i !== st.idx) {
      st.idx = i;
      $("rPrev").textContent = st.chunks[i - 1] ? st.chunks[i - 1].text : "";
      $("rCur").innerHTML = wordsHTML(st.chunks[i]);
      $("rNext").textContent = st.chunks[i + 1] ? st.chunks[i + 1].text : "";
    }
    const c = st.chunks[i];
    if (c.words) {
      let lit = true;
      const flags = c.words.map((w) => { if (w.s != null) lit = w.s <= t; return lit; });
      $("rCur").querySelectorAll(".w").forEach((el) => el.classList.toggle("lit", flags[+el.dataset.j]));
    }
    const dur = audio.duration || (st.book && st.book.duration) || 0;
    $("rBar").style.width = dur ? (100 * audio.currentTime / dur).toFixed(2) + "%" : "0";
    $("rPct").textContent = dur ? Math.floor(100 * audio.currentTime / dur) + "%" : "";
    $("rTime").textContent = clock(audio.currentTime) + " / " + clock(dur);
    $("rState").innerHTML = audio.paused
      ? `<span class="paused-badge">Paused</span>  Select to play, up for options`
      : (SPEEDS[st.speedIdx] !== 1 ? SPEEDS[st.speedIdx] + "× speed" : "");
  }
  let raf = 0;
  function loop() { update(); raf = requestAnimationFrame(loop); }
  audio.addEventListener("play", () => { st.touched = true; cancelAnimationFrame(raf); loop(); });
  audio.addEventListener("pause", () => { cancelAnimationFrame(raf); update(); save(true); });
  audio.addEventListener("seeked", update);
  audio.addEventListener("ended", update);

  function seekChunk(delta) {
    st.touched = true;
    const i = Math.max(0, Math.min(st.chunks.length - 1, st.idx + delta));
    audio.currentTime = Math.max(0, st.chunks[i].start - st.offset + 0.01);
    update();
  }
  // Saved on the glasses every 5 s while playing; synced to Google Drive (if connected)
  // at most every 30 s, and right away on pause or when the app is hidden.
  function save(urgent) {
    if (!st.book || !st.touched) return;
    const rec = { pos: audio.currentTime, offset: st.offset, speed: SPEEDS[st.speedIdx], at: Date.now() };
    store.set("readalong:" + st.book.id, rec);
    if (Cloud.enabled) Cloud.savePosition(st.book.id, rec, urgent === true);
  }
  setInterval(() => { if (!audio.paused) save(); }, 5000);
  addEventListener("pagehide", () => save(true));
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });

  // ---------- options menu ----------
  const menuItems = [
    { label: "Speed", value: () => SPEEDS[st.speedIdx] + "×",
      adjust: (d) => { st.speedIdx = Math.max(0, Math.min(SPEEDS.length - 1, st.speedIdx + d)); audio.playbackRate = SPEEDS[st.speedIdx]; } },
    { label: "Text timing", value: () => (st.offset > 0 ? "+" : "") + st.offset.toFixed(2) + "s",
      adjust: (d) => { st.offset = Math.round((st.offset + d * 0.25) * 100) / 100; st.idx = -1; } },
    { label: "Back 30 seconds", action: true, run: () => { st.touched = true; audio.currentTime = Math.max(0, audio.currentTime - 30); } },
    { label: "Library", action: true, run: () => { closeMenu(); audio.pause(); show("library"); renderLibrary(); } },
    { label: "Remove download", action: true, when: () => st.book && st.book.drive && st.book.offline,
      run: async () => {
        // Frees space on the glasses; the book stays in Google Drive.
        closeMenu(); audio.pause(); save(true);
        const b = st.book;
        if (audio.src.startsWith("blob:")) URL.revokeObjectURL(audio.src);
        audio.removeAttribute("src"); audio.load();
        await Cloud.removeDownload(b);
        b.offline = false;
        st.book = null;
        show("library"); renderLibrary();
      } },
  ];
  const visibleItems = () => menuItems.filter((m) => !m.when || m.when());
  function renderMenu() {
    $("menuRows").innerHTML = visibleItems().map((m, i) =>
      `<div class="row ${m.action ? "action" : ""} ${i === st.menuSel ? "sel" : ""}"><span>${m.label}</span><span class="v">${m.value ? m.value() : ""}</span></div>`).join("");
  }
  function openMenu() { st.menuOpen = true; st.menuSel = 0; $("menu").classList.add("on"); renderMenu(); }
  function closeMenu() { st.menuOpen = false; $("menu").classList.remove("on"); save(); update(); }

  // ---------- input: arrow keys + Enter (Neural Band / D-pad) ----------
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", " ", "Escape", "Backspace"].includes(k)) return;
    e.preventDefault();

    if (st.screen === "connect") {
      if (k === "Escape" || k === "Backspace") cancelConnect();
      return;
    }

    if (st.screen === "library") {
      if (download && (k === "Escape" || k === "Backspace")) return download.abort();
      if (!st.books.length) return;
      if (k === "ArrowUp") st.sel = (st.sel - 1 + st.books.length) % st.books.length;
      else if (k === "ArrowDown") st.sel = (st.sel + 1) % st.books.length;
      else if (k === "Enter" || k === " ") return openBook(st.books[st.sel]);
      renderLibrary();
      return;
    }

    if (st.menuOpen) {
      const items = visibleItems();
      const m = items[st.menuSel];
      if (k === "ArrowUp") st.menuSel = Math.max(0, st.menuSel - 1);
      else if (k === "ArrowDown") st.menuSel = Math.min(items.length - 1, st.menuSel + 1);
      else if ((k === "ArrowLeft" || k === "ArrowRight") && m.adjust) m.adjust(k === "ArrowLeft" ? -1 : 1);
      else if ((k === "Enter" || k === " ") && m.action) { m.run(); if (st.menuOpen) closeMenu(); return; }
      else if (k === "Escape" || k === "Backspace" || ((k === "Enter" || k === " ") && !m.action)) return closeMenu();
      renderMenu();
      return;
    }

    if (k === "Enter" || k === " ") audio.paused ? audio.play().catch(() => {}) : audio.pause();
    else if (k === "ArrowLeft") seekChunk(-1);
    else if (k === "ArrowRight") seekChunk(1);
    else if (k === "ArrowUp") openMenu();
    else if (k === "Escape" || k === "Backspace") { audio.pause(); show("library"); renderLibrary(); }
  });

  loadLibrary();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
