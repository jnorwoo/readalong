# Publishes web/ to GitHub Pages on every push to main, so the glasses
# can open https://<your-username>.github.io/<repo>/glasses.html
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pypdf
      - run: python -m unittest discover tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave private books out of the site
        run: rm -rf web/books/private web/library.private.json
      - name: Fill in Google Drive settings (optional, see docs/google-drive.md)
        env:
          CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            python3 -c 'import json, os; open("web/cloud-config.js", "w").write("window.READALONG_CLOUD = " + json.dumps({"clientId": os.environ["CLIENT_ID"], "clientSecret": os.environ.get("CLIENT_SECRET", "")}) + ";\n")'
            echo "Google Drive features on."
          else
            echo "No GOOGLE_CLIENT_ID variable; Google Drive features stay off."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
